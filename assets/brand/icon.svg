<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="Ferrotype">
  <!-- F · Shift: two frames, one advanced. Before and after, or the film advancing. Light tile. -->
